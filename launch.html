<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishna &amp; Muskan | Royal Wedding Invitation</title>

  <!-- SEO & Social Sharing Meta Tags -->
  <meta name="description"
    content="You are cordially invited to celebrate the royal wedding of Krishna Kumar & Kumari Muskan. Shubh Vivah 25th November 2026 at Sangli Resort, Dhanbad.">
  <meta property="og:title" content="Krishna & Muskan | Royal Wedding Invitation">
  <meta property="og:description"
    content="Celebrate the union of Krishna & Muskan. Shubh Vivah 25th November 2026.">
  <meta property="og:image" content="assets/images/couple_hero.jpg">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="home-body">

  <!-- Floating Falling Rose Petals & Golden Sparkles Canvas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Background Decorative Rotating Mandalas -->
  <div class="bg-mandala bg-mandala-left"></div>
  <div class="bg-mandala bg-mandala-right"></div>

  <!-- Floating Circular Music Play/Pause Button (Top Right Corner) -->
  <div class="floating-music-wrapper" id="floating-music-bar">
    <button id="floating-music-btn" class="music-circle-btn" title="Play or Pause Music" aria-label="Play or Pause Music">
      <i id="music-play-pause-icon" class="fa-solid fa-play"></i>
    </button>
  </div>

  <!-- ========================================================================
       GRAND ROYAL PALACE DOORS (ENTRANCE SCREEN OVERLAY)
       ======================================================================== -->
  <div id="royal-doors-screen" class="royal-doors-screen">
    
    <!-- Deep Palace Architectural Vignette & Ambience -->
    <div class="palace-bg-vignette"></div>

    <!-- Side Pillar 1: Left Hanging Brass Diya Lamp -->
    <div class="palace-decor-side decor-left" aria-hidden="true">
      <div class="hanging-brass-lamp lamp-left">
        <div class="lamp-chain"></div>
        <div class="lamp-body">
          <div class="lamp-flame"></div>
        </div>
      </div>
      <div class="floral-garland-drape garland-left"></div>
      <div class="floor-diya-glow diya-left">
        <div class="diya-flame-light"></div>
      </div>
    </div>

    <!-- Side Pillar 2: Right Hanging Brass Diya Lamp -->
    <div class="palace-decor-side decor-right" aria-hidden="true">
      <div class="hanging-brass-lamp lamp-right">
        <div class="lamp-chain"></div>
        <div class="lamp-body">
          <div class="lamp-flame"></div>
        </div>
      </div>
      <div class="floral-garland-drape garland-right"></div>
      <div class="floor-diya-glow diya-right">
        <div class="diya-flame-light"></div>
      </div>
    </div>

    <!-- Central Palace Portal Stage -->
    <div class="royal-palace-stage">
      
      <!-- Palace Top Archway Header -->
      <header class="royal-palace-header">
        <div class="palace-om-crest">
          <div class="crest-mandala-ring">
            <span class="crest-om-icon">ॐ</span>
          </div>
        </div>

        <p class="palace-ganesh-shloka">॥ ॐ श्री गणेशाय नमः ॥</p>
        
        <div class="palace-header-divider">
          <span class="h-line"></span>
          <span class="h-heart">♡</span>
          <span class="h-line"></span>
        </div>

        <h2 class="palace-invitation-subtitle">THE ROYAL WEDDING INVITATION</h2>
        
        <h1 class="palace-couple-names">
          <span class="name-part">KRISHNA</span>
          <span class="name-amp">&amp;</span>
          <span class="name-part">MUSKAN</span>
        </h1>
        
        <p class="palace-journey-tagline">TWO SOULS, ONE BEAUTIFUL JOURNEY</p>
      </header>

      <!-- 3D Double Royal Palace Doors (Full Height, Carved Mehrab Arch & Heavy Brass Knockers) -->
      <div id="doors-container" class="royal-doors-viewport royal-grand-doors" role="button" tabindex="0" title="Tap to Open Royal Palace Doors">
        
        <!-- Grand Palace Outer Mehrab Arch Frame -->
        <div class="palace-arch-moulding"></div>
        <div class="palace-arch-top-crown"></div>

        <!-- Left Palace Door Wing -->
        <div class="palace-door-leaf leaf-left">
          <div class="door-panel-wood">
            
            <!-- Authentic Rajput Mehrab Arch Header -->
            <div class="door-mehrab-arch">
              <div class="arch-gold-filigree"></div>
            </div>

            <div class="door-inner-carved-frame">
              
              <!-- Top Carved Panel: Royal Lotus Mandala & Jali Lattice -->
              <div class="carved-section section-lotus">
                <div class="wood-plank-lines"></div>
                <div class="carved-inset-border">
                  <svg class="gold-lotus-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="46" stroke="url(#lotusBorderGold)" stroke-width="2" stroke-dasharray="4 2"/>
                    <circle cx="50" cy="50" r="41" stroke="#F9E496" stroke-width="1" opacity="0.6"/>
                    <circle cx="50" cy="50" r="34" fill="rgba(80, 8, 24, 0.45)" stroke="#D4AF37" stroke-width="1.2"/>
                    <!-- Intricate Royal Lotus -->
                    <path d="M50 18 C43 32 42 52 50 72 C58 52 57 32 50 18 Z" fill="url(#goldGrad)" />
                    <path d="M50 24 C32 38 27 58 43 71 C37 54 43 36 50 24 Z" fill="url(#goldGradLight)" />
                    <path d="M50 24 C68 38 73 58 57 71 C63 54 57 36 50 24 Z" fill="url(#goldGradLight)" />
                    <path d="M50 32 C22 45 20 65 35 73 C30 59 39 46 50 32 Z" fill="url(#goldGrad)" opacity="0.95"/>
                    <path d="M50 32 C78 45 80 65 65 73 C70 59 61 46 50 32 Z" fill="url(#goldGrad)" opacity="0.95"/>
                    <circle cx="50" cy="72" r="4.5" fill="#FFF6D6" stroke="#B88E28" stroke-width="1"/>
                    <defs>
                      <linearGradient id="lotusBorderGold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF6D6"/>
                        <stop offset="50%" stop-color="#D4AF37"/>
                        <stop offset="100%" stop-color="#7A560C"/>
                      </linearGradient>
                      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF6D6"/>
                        <stop offset="45%" stop-color="#F9E496"/>
                        <stop offset="75%" stop-color="#D4AF37"/>
                        <stop offset="100%" stop-color="#7A560C"/>
                      </linearGradient>
                      <linearGradient id="goldGradLight" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFFFFF"/>
                        <stop offset="50%" stop-color="#F9E496"/>
                        <stop offset="100%" stop-color="#B88E28"/>
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
              </div>

              <!-- Center Heavy Brass Knocker Section (Left Lion Mount & Ring) -->
              <div class="door-middle-patti">
                <div class="brass-knocker-assembly knocker-left">
                  <div class="knocker-lion-head">
                    <span class="lion-mouth-hole"></span>
                  </div>
                  <div class="knocker-brass-ring"></div>
                  <div class="knocker-strike-plate"></div>
                </div>
              </div>
              
              <!-- Bottom Carved Panel: Royal Elephant Inlay (Gajraj facing inward) -->
              <div class="carved-section section-elephant">
                <div class="wood-plank-lines"></div>
                <div class="carved-inset-border">
                  <svg class="gold-elephant-svg elephant-right" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 90 Q60 84 105 90" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Caparisoned Elephant Body with Raised Trunk -->
                    <path d="M30 87 L30 66 C30 52 42 38 58 38 C72 38 86 44 94 54 C98 58 102 54 104 46 C106 40 110 38 112 42 C114 46 108 58 98 64 L100 87 L88 87 L86 70 L72 70 L70 87 L56 87 L58 68 L44 68 L42 87 Z" fill="url(#elephantGold)"/>
                    <!-- Royal Velvet Saddle (Jhool) & Gold Tassels -->
                    <path d="M48 45 Q66 42 84 45 L82 64 Q66 67 50 64 Z" fill="#6A081E" stroke="#F9E496" stroke-width="1.5"/>
                    <circle cx="66" cy="54" r="3.5" fill="#FFF6D6"/>
                    <!-- Tusk, Crown & Jewels -->
                    <path d="M96 61 Q105 59 107 52" stroke="#FFF6D6" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="88" cy="44" r="2.5" fill="#200208"/>
                    <path d="M84 38 Q90 32 94 38" stroke="#F9E496" stroke-width="1.5" fill="none"/>
                    <defs>
                      <linearGradient id="elephantGold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF6D6"/>
                        <stop offset="35%" stop-color="#F9E496"/>
                        <stop offset="70%" stop-color="#D4AF37"/>
                        <stop offset="100%" stop-color="#6E4B07"/>
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
              </div>

            </div>

            <!-- Outer Column of 3D Embossed Brass Studs -->
            <div class="door-studs-rail studs-rail-left">
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
            </div>
          </div>
        </div>

        <!-- Right Palace Door Wing -->
        <div class="palace-door-leaf leaf-right">
          <div class="door-panel-wood">
            
            <!-- Authentic Rajput Mehrab Arch Header -->
            <div class="door-mehrab-arch">
              <div class="arch-gold-filigree"></div>
            </div>

            <div class="door-inner-carved-frame">
              
              <!-- Top Carved Panel: Royal Lotus Mandala & Jali Lattice -->
              <div class="carved-section section-lotus">
                <div class="wood-plank-lines"></div>
                <div class="carved-inset-border">
                  <svg class="gold-lotus-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="46" stroke="url(#lotusBorderGoldR)" stroke-width="2" stroke-dasharray="4 2"/>
                    <circle cx="50" cy="50" r="41" stroke="#F9E496" stroke-width="1" opacity="0.6"/>
                    <circle cx="50" cy="50" r="34" fill="rgba(80, 8, 24, 0.45)" stroke="#D4AF37" stroke-width="1.2"/>
                    <!-- Intricate Royal Lotus -->
                    <path d="M50 18 C43 32 42 52 50 72 C58 52 57 32 50 18 Z" fill="url(#goldGradR)" />
                    <path d="M50 24 C32 38 27 58 43 71 C37 54 43 36 50 24 Z" fill="url(#goldGradLightR)" />
                    <path d="M50 24 C68 38 73 58 57 71 C63 54 57 36 50 24 Z" fill="url(#goldGradLightR)" />
                    <path d="M50 32 C22 45 20 65 35 73 C30 59 39 46 50 32 Z" fill="url(#goldGradR)" opacity="0.95"/>
                    <path d="M50 32 C78 45 80 65 65 73 C70 59 61 46 50 32 Z" fill="url(#goldGradR)" opacity="0.95"/>
                    <circle cx="50" cy="72" r="4.5" fill="#FFF6D6" stroke="#B88E28" stroke-width="1"/>
                    <defs>
                      <linearGradient id="lotusBorderGoldR" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF6D6"/>
                        <stop offset="50%" stop-color="#D4AF37"/>
                        <stop offset="100%" stop-color="#7A560C"/>
                      </linearGradient>
                      <linearGradient id="goldGradR" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF6D6"/>
                        <stop offset="45%" stop-color="#F9E496"/>
                        <stop offset="75%" stop-color="#D4AF37"/>
                        <stop offset="100%" stop-color="#7A560C"/>
                      </linearGradient>
                      <linearGradient id="goldGradLightR" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFFFFF"/>
                        <stop offset="50%" stop-color="#F9E496"/>
                        <stop offset="100%" stop-color="#B88E28"/>
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
              </div>

              <!-- Center Heavy Brass Knocker Section (Right Lion Mount & Ring) -->
              <div class="door-middle-patti">
                <div class="brass-knocker-assembly knocker-right">
                  <div class="knocker-lion-head">
                    <span class="lion-mouth-hole"></span>
                  </div>
                  <div class="knocker-brass-ring"></div>
                  <div class="knocker-strike-plate"></div>
                </div>
              </div>
              
              <!-- Bottom Carved Panel: Royal Elephant Inlay (Gajraj facing inward) -->
              <div class="carved-section section-elephant">
                <div class="wood-plank-lines"></div>
                <div class="carved-inset-border">
                  <svg class="gold-elephant-svg elephant-left" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: scaleX(-1);">
                    <path d="M15 90 Q60 84 105 90" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Caparisoned Elephant Body with Raised Trunk -->
                    <path d="M30 87 L30 66 C30 52 42 38 58 38 C72 38 86 44 94 54 C98 58 102 54 104 46 C106 40 110 38 112 42 C114 46 108 58 98 64 L100 87 L88 87 L86 70 L72 70 L70 87 L56 87 L58 68 L44 68 L42 87 Z" fill="url(#elephantGoldR)"/>
                    <!-- Royal Velvet Saddle (Jhool) & Gold Tassels -->
                    <path d="M48 45 Q66 42 84 45 L82 64 Q66 67 50 64 Z" fill="#6A081E" stroke="#F9E496" stroke-width="1.5"/>
                    <circle cx="66" cy="54" r="3.5" fill="#FFF6D6"/>
                    <!-- Tusk, Crown & Jewels -->
                    <path d="M96 61 Q105 59 107 52" stroke="#FFF6D6" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="88" cy="44" r="2.5" fill="#200208"/>
                    <path d="M84 38 Q90 32 94 38" stroke="#F9E496" stroke-width="1.5" fill="none"/>
                    <defs>
                      <linearGradient id="elephantGoldR" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF6D6"/>
                        <stop offset="35%" stop-color="#F9E496"/>
                        <stop offset="70%" stop-color="#D4AF37"/>
                        <stop offset="100%" stop-color="#6E4B07"/>
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
              </div>

            </div>

            <!-- Outer Column of 3D Embossed Brass Studs -->
            <div class="door-studs-rail studs-rail-right">
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
              <span class="door-stud"></span>
            </div>
          </div>
        </div>

        <!-- Central Decorative Brass Lock Seam (Kundi & Sankal) -->
        <div class="door-center-lock-plate">
          <div class="lock-om-crest">ॐ</div>
        </div>

        <!-- Central Divine Golden Light Seam -->
        <div class="door-sanctum-light-beam"></div>

        <!-- Divine Flash Particle Aura when Opening -->
        <div class="door-light-burst"></div>
      </div>

      <!-- Bottom Corner Ornate Mandalas -->
      <div class="bottom-mandala-corner corner-bl"></div>
      <div class="bottom-mandala-corner corner-br"></div>

    </div>
  </div>

  <!-- ========================================================================
       SACRED WEDDING HOME SCREEN (BEHIND THE DOORS)
       ======================================================================== -->
  <div id="main-scroll-app" class="main-screen-app">
    
    <main class="sacred-home-container">
      
      <!-- Top Section: Groom Details -->
      <div class="person-details-section groom-details-top">
        <h1 class="calligraphy-royal-name">Krishna Kumar</h1>
        <p class="kinship-label">Son of</p>
        <p class="parents-names">Smt. Sunita &amp; Shri Rajendra Singhania</p>
      </div>

      <!-- Center Section: home_center.png Image (100% width of screen, auto height, uncropped) -->
      <div class="home-center-wrapper">
        <img src="assets/images/home_center.png" alt="Sacred Union" class="home-center-img" />
      </div>

      <!-- Bottom Section: Bride Details -->
      <div class="person-details-section bride-details-bottom">
        <h1 class="calligraphy-royal-name">Kumari Muskan</h1>
        <p class="kinship-label">Daughter of</p>
        <p class="parents-names">Smt. Annu Prasad &amp; Shri Uday Shankar Prasad</p>
      </div>

    </main>

  </div>

  <!-- Audio Element -->
  <audio id="bg-audio" preload="auto" loop>
    <source src="assets/audio/jai_jai_ram.mp3" type="audio/mpeg">
  </audio>

  <!-- Scripts -->
  <script src="wedding-config.js"></script>
  <script src="launch.js"></script>
</body>

</html>
